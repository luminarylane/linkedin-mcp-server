name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
  test:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: test "${{ needs.test-matrix.result }}" = success
